<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="726" viewBox="0 0 1200 726" role="img" aria-label="How programs, the kernel, the interpreter and the board fit together">
<title>How programs, the kernel, the interpreter and the board fit together</title>
<style>
:root {
  --fg:#1f2328; --muted:#59636e; --card:#f6f8fa; --line:#d0d7de; --bg:#ffffff;
  --prog:#6c5ce7; --prog-soft:#f0eefe;
  --kern:#0e9384; --kern-soft:#e6f6f4;
  --vm:#d9692a; --vm-soft:#fdf0e8;
  --board:#2f6fdf; --board-soft:#eaf1fd;
  --stop:#d1242f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fg:#e6edf3; --muted:#9198a1; --card:#161b22; --line:#30363d; --bg:#0d1117;
    --prog:#a29bfe; --prog-soft:#1f1b3a;
    --kern:#3ec9b6; --kern-soft:#0f2a27;
    --vm:#f39a5c; --vm-soft:#33200f;
    --board:#6ea2ff; --board-soft:#132440;
    --stop:#ff7b72;
  }
}
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
.muted { fill: var(--muted); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
<rect x="20" y="16" width="1160" height="110" rx="16" style="fill:var(--prog-soft);stroke:var(--prog)" stroke-width="2"/><text x="44" y="62" font-size="24" font-weight="750" text-anchor="start" style="fill:var(--prog)">Programs</text><text x="44" y="90" font-size="16" font-weight="500" text-anchor="start" class="muted mono">.wasm files</text><rect x="250.0" y="38.0" width="292.6666666666667" height="66" rx="10" style="fill:var(--card);stroke:var(--prog)" stroke-width="1.8"/><text x="266.0" y="66.0" font-size="19" font-weight="650" text-anchor="start">C / C++ with WASI</text><text x="266.0" y="90.0" font-size="15.5" font-weight="400" text-anchor="start" class="muted">printf, files, clocks, arguments</text><rect x="558.6666666666667" y="38.0" width="292.6666666666667" height="66" rx="10" style="fill:var(--card);stroke:var(--prog)" stroke-width="1.8"/><text x="574.6666666666667" y="66.0" font-size="19" font-weight="650" text-anchor="start">Arduino sketches</text><text x="574.6666666666667" y="90.0" font-size="15.5" font-weight="400" text-anchor="start" class="muted">setup(), loop(), Serial, Wire, SPI</text><rect x="867.3333333333334" y="38.0" width="292.6666666666667" height="66" rx="10" style="fill:var(--card);stroke:var(--prog)" stroke-width="1.8"/><text x="883.3333333333334" y="66.0" font-size="19" font-weight="650" text-anchor="start">Other languages</text><text x="883.3333333333334" y="90.0" font-size="15.5" font-weight="400" text-anchor="start" class="muted">anything that compiles to Wasm</text>
<line x1="600.0" y1="132.0" x2="600.0" y2="176.0" style="stroke:var(--muted)" stroke-width="3" stroke-linecap="round"/><path d="M594.8,165.2 L600.0,176.0 L605.2,165.2" style="fill:none;stroke:var(--muted)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="622" y="161" font-size="17" font-weight="500" text-anchor="start" class="muted">imports: WASI and the wasm-rtos ABI 1.8</text>
<rect x="20" y="182" width="1160" height="196" rx="16" style="fill:var(--kern-soft);stroke:var(--kern)" stroke-width="2"/><text x="44" y="228" font-size="24" font-weight="750" text-anchor="start" style="fill:var(--kern)">Kernel</text><text x="44" y="256" font-size="16" font-weight="500" text-anchor="start" class="muted mono">wasm-rtos</text><rect x="250.0" y="206.0" width="292.6666666666667" height="66" rx="10" style="fill:var(--card);stroke:var(--kern)" stroke-width="1.8"/><text x="266.0" y="234.0" font-size="19" font-weight="650" text-anchor="start">Scheduler</text><text x="266.0" y="258.0" font-size="15.5" font-weight="400" text-anchor="start" class="muted">priorities, slices of fuel</text><rect x="558.6666666666667" y="206.0" width="292.6666666666667" height="66" rx="10" style="fill:var(--card);stroke:var(--kern)" stroke-width="1.8"/><text x="574.6666666666667" y="234.0" font-size="19" font-weight="650" text-anchor="start">Sync objects</text><text x="574.6666666666667" y="258.0" font-size="15.5" font-weight="400" text-anchor="start" class="muted">queues, mutexes, events, timers</text><rect x="867.3333333333334" y="206.0" width="292.6666666666667" height="66" rx="10" style="fill:var(--card);stroke:var(--kern)" stroke-width="1.8"/><text x="883.3333333333334" y="234.0" font-size="19" font-weight="650" text-anchor="start">Processes</text><text x="883.3333333333334" y="258.0" font-size="15.5" font-weight="400" text-anchor="start" class="muted">spawn, wait, kill, argv, files</text><rect x="250.0" y="288.0" width="292.6666666666667" height="66" rx="10" style="fill:var(--card);stroke:var(--kern)" stroke-width="1.8"/><text x="266.0" y="316.0" font-size="19" font-weight="650" text-anchor="start">Drivers</text><text x="266.0" y="340.0" font-size="15.5" font-weight="400" text-anchor="start" class="muted">GPIO, display, buses, PWM, UART</text><rect x="558.6666666666667" y="288.0" width="292.6666666666667" height="66" rx="10" style="fill:var(--card);stroke:var(--kern)" stroke-width="1.8"/><text x="574.6666666666667" y="316.0" font-size="19" font-weight="650" text-anchor="start">Memory policy</text><text x="574.6666666666667" y="340.0" font-size="15.5" font-weight="400" text-anchor="start" class="muted">RAM budget, page store, swap</text><rect x="867.3333333333334" y="288.0" width="292.6666666666667" height="66" rx="10" style="fill:var(--card);stroke:var(--kern)" stroke-width="1.8"/><text x="883.3333333333334" y="316.0" font-size="19" font-weight="650" text-anchor="start">Snapshots</text><text x="883.3333333333334" y="340.0" font-size="15.5" font-weight="400" text-anchor="start" class="muted">save a task, continue elsewhere</text>
<line x1="600.0" y1="384.0" x2="600.0" y2="428.0" style="stroke:var(--muted)" stroke-width="3" stroke-linecap="round"/><path d="M594.8,417.2 L600.0,428.0 L605.2,417.2" style="fill:none;stroke:var(--muted)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="622" y="413" font-size="17" font-weight="500" text-anchor="start" class="muted">runs slices, links imports, moves frames</text>
<rect x="20" y="434" width="1160" height="110" rx="16" style="fill:var(--vm-soft);stroke:var(--vm)" stroke-width="2"/><text x="44" y="480" font-size="24" font-weight="750" text-anchor="start" style="fill:var(--vm)">Interpreter</text><text x="44" y="508" font-size="16" font-weight="500" text-anchor="start" class="muted mono">wasm-rtos-vm</text><rect x="250.0" y="456.0" width="215.5" height="66" rx="10" style="fill:var(--card);stroke:var(--vm)" stroke-width="1.8"/><text x="266.0" y="484.0" font-size="19" font-weight="650" text-anchor="start">Fuel</text><text x="266.0" y="508.0" font-size="15.5" font-weight="400" text-anchor="start" class="muted">every instruction counted</text><rect x="481.5" y="456.0" width="215.5" height="66" rx="10" style="fill:var(--card);stroke:var(--vm)" stroke-width="1.8"/><text x="497.5" y="484.0" font-size="19" font-weight="650" text-anchor="start">MMU</text><text x="497.5" y="508.0" font-size="15.5" font-weight="400" text-anchor="start" class="muted">frames, TLB, pager</text><rect x="713.0" y="456.0" width="215.5" height="66" rx="10" style="fill:var(--card);stroke:var(--vm)" stroke-width="1.8"/><text x="729.0" y="484.0" font-size="19" font-weight="650" text-anchor="start">Code cache</text><text x="729.0" y="508.0" font-size="15.5" font-weight="400" text-anchor="start" class="muted">records made on first call</text><rect x="944.5" y="456.0" width="215.5" height="66" rx="10" style="fill:var(--card);stroke:var(--vm)" stroke-width="1.8"/><text x="960.5" y="484.0" font-size="19" font-weight="650" text-anchor="start">Snapshots</text><text x="960.5" y="508.0" font-size="15.5" font-weight="400" text-anchor="start" class="muted">positions in the module</text>
<line x1="600.0" y1="550.0" x2="600.0" y2="594.0" style="stroke:var(--muted)" stroke-width="3" stroke-linecap="round"/><path d="M594.8,583.2 L600.0,594.0 L605.2,583.2" style="fill:none;stroke:var(--muted)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="622" y="579" font-size="17" font-weight="500" text-anchor="start" class="muted">a clock and device ports</text>
<rect x="20" y="600" width="1160" height="110" rx="16" style="fill:var(--board-soft);stroke:var(--board)" stroke-width="2"/><text x="44" y="646" font-size="24" font-weight="750" text-anchor="start" style="fill:var(--board)">Board</text><text x="44" y="674" font-size="16" font-weight="500" text-anchor="start" class="muted mono">or the browser</text><rect x="250.0" y="622.0" width="292.6666666666667" height="66" rx="10" style="fill:var(--card);stroke:var(--board)" stroke-width="1.8"/><text x="266.0" y="650.0" font-size="19" font-weight="650" text-anchor="start">ESP32, STM32, ...</text><text x="266.0" y="674.0" font-size="15.5" font-weight="400" text-anchor="start" class="muted">clock, GPIO, buses, DMA</text><rect x="558.6666666666667" y="622.0" width="292.6666666666667" height="66" rx="10" style="fill:var(--card);stroke:var(--board)" stroke-width="1.8"/><text x="574.6666666666667" y="650.0" font-size="19" font-weight="650" text-anchor="start">Storage</text><text x="574.6666666666667" y="674.0" font-size="15.5" font-weight="400" text-anchor="start" class="muted">SD card, SPI RAM, FRAM, flash</text><rect x="867.3333333333334" y="622.0" width="292.6666666666667" height="66" rx="10" style="fill:var(--card);stroke:var(--board)" stroke-width="1.8"/><text x="883.3333333333334" y="650.0" font-size="19" font-weight="650" text-anchor="start">Simulator</text><text x="883.3333333333334" y="674.0" font-size="15.5" font-weight="400" text-anchor="start" class="muted">the same kernel in WebAssembly</text>
</svg>
