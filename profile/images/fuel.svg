<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="A task runs until its fuel is gone, then another task runs, or the first one again from where it stopped">
<title>A task runs until its fuel is gone, then another task runs, or the first one again from where it stopped</title>
<style>
:root {
  --fg:#1f2328; --muted:#59636e; --card:#f6f8fa; --line:#d0d7de; --bg:#ffffff;
  --prog:#6c5ce7; --prog-soft:#f0eefe;
  --kern:#0e9384; --kern-soft:#e6f6f4;
  --vm:#d9692a; --vm-soft:#fdf0e8;
  --board:#2f6fdf; --board-soft:#eaf1fd;
  --stop:#d1242f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fg:#e6edf3; --muted:#9198a1; --card:#161b22; --line:#30363d; --bg:#0d1117;
    --prog:#a29bfe; --prog-soft:#1f1b3a;
    --kern:#3ec9b6; --kern-soft:#0f2a27;
    --vm:#f39a5c; --vm-soft:#33200f;
    --board:#6ea2ff; --board-soft:#132440;
    --stop:#ff7b72;
  }
}
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
.muted { fill: var(--muted); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
<text x="40" y="152" font-size="20" font-weight="700" text-anchor="start" style="fill:var(--vm)">Task A</text>
<text x="40" y="268" font-size="20" font-weight="700" text-anchor="start" style="fill:var(--kern)">Task B</text>
<line x1="140" y1="145.0" x2="1180" y2="145.0" style="stroke:var(--line)" stroke-width="1.5" stroke-dasharray="4 6"/>
<line x1="140" y1="261.0" x2="1180" y2="261.0" style="stroke:var(--line)" stroke-width="1.5" stroke-dasharray="4 6"/>
<rect x="150" y="120" width="92" height="50" rx="9" style="fill:var(--vm-soft);stroke:var(--vm)" stroke-width="2"/>
<text x="196.0" y="151" font-size="15.5" font-weight="600" text-anchor="middle" class="mono">local.get</text>
<text x="196.0" y="110" font-size="15" font-weight="700" text-anchor="middle" style="fill:var(--vm)">3</text>
<rect x="248" y="120" width="92" height="50" rx="9" style="fill:var(--vm-soft);stroke:var(--vm)" stroke-width="2"/>
<text x="294.0" y="151" font-size="15.5" font-weight="600" text-anchor="middle" class="mono">i32.load</text>
<text x="294.0" y="110" font-size="15" font-weight="700" text-anchor="middle" style="fill:var(--vm)">2</text>
<rect x="346" y="120" width="92" height="50" rx="9" style="fill:var(--vm-soft);stroke:var(--vm)" stroke-width="2"/>
<text x="392.0" y="151" font-size="15.5" font-weight="600" text-anchor="middle" class="mono">i32.add</text>
<text x="392.0" y="110" font-size="15" font-weight="700" text-anchor="middle" style="fill:var(--vm)">1</text>
<rect x="444" y="120" width="92" height="50" rx="9" style="fill:var(--vm-soft);stroke:var(--vm)" stroke-width="2"/>
<text x="490.0" y="151" font-size="15.5" font-weight="600" text-anchor="middle" class="mono">i32.store</text>
<text x="490.0" y="110" font-size="15" font-weight="700" text-anchor="middle" style="fill:var(--vm)">0</text>
<line x1="548" y1="90" x2="548" y2="184" style="stroke:var(--stop)" stroke-width="4" stroke-linecap="round"/>
<text x="150" y="54" font-size="17" font-weight="650" text-anchor="start">1. A runs: every instruction takes one unit of fuel</text>
<text x="560" y="176" font-size="15.5" font-weight="650" text-anchor="start" style="fill:var(--stop)">fuel 0: A stops</text>
<text x="560" y="196" font-size="15.5" font-weight="500" text-anchor="start" style="fill:var(--stop)">between two instructions</text>
<rect x="578" y="236" width="92" height="50" rx="9" style="fill:var(--kern-soft);stroke:var(--kern)" stroke-width="2"/>
<text x="624.0" y="267" font-size="15.5" font-weight="600" text-anchor="middle" class="mono">call</text>
<text x="624.0" y="226" font-size="15" font-weight="700" text-anchor="middle" style="fill:var(--kern)">2</text>
<rect x="676" y="236" width="92" height="50" rx="9" style="fill:var(--kern-soft);stroke:var(--kern)" stroke-width="2"/>
<text x="722.0" y="267" font-size="15.5" font-weight="600" text-anchor="middle" class="mono">i32.mul</text>
<text x="722.0" y="226" font-size="15" font-weight="700" text-anchor="middle" style="fill:var(--kern)">1</text>
<rect x="774" y="236" width="92" height="50" rx="9" style="fill:var(--kern-soft);stroke:var(--kern)" stroke-width="2"/>
<text x="820.0" y="267" font-size="15.5" font-weight="600" text-anchor="middle" class="mono">br_if</text>
<text x="820.0" y="226" font-size="15" font-weight="700" text-anchor="middle" style="fill:var(--kern)">0</text>
<line x1="878" y1="206" x2="878" y2="300" style="stroke:var(--stop)" stroke-width="4" stroke-linecap="round"/>
<text x="578" y="320" font-size="17" font-weight="650" text-anchor="start">2. another task gets a slice</text>
<line x1="548.0" y1="210.0" x2="574.0" y2="246.0" style="stroke:var(--muted)" stroke-width="2.2" stroke-linecap="round"/><path d="M563.4,240.3 L574.0,246.0 L571.9,234.2" style="fill:none;stroke:var(--muted)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="906" y="120" width="92" height="50" rx="9" style="fill:var(--vm-soft);stroke:var(--vm)" stroke-width="2"/>
<text x="952.0" y="151" font-size="15.5" font-weight="600" text-anchor="middle" class="mono">br_if</text>
<text x="952.0" y="110" font-size="15" font-weight="700" text-anchor="middle" style="fill:var(--vm)">3</text>
<rect x="1004" y="120" width="92" height="50" rx="9" style="fill:var(--vm-soft);stroke:var(--vm)" stroke-width="2"/>
<text x="1050.0" y="151" font-size="15.5" font-weight="600" text-anchor="middle" class="mono">call</text>
<text x="1050.0" y="110" font-size="15" font-weight="700" text-anchor="middle" style="fill:var(--vm)">2</text>
<text x="1110" y="152" font-size="22" font-weight="700" text-anchor="start" class="muted">…</text>
<text x="886" y="54" font-size="17" font-weight="650" text-anchor="start">3. or A again, later:</text>
<text x="886" y="76" font-size="16" font-weight="500" text-anchor="start" class="muted">from the very next instruction</text>
<line x1="884.0" y1="246.0" x2="902.0" y2="164.0" style="stroke:var(--muted)" stroke-width="2.2" stroke-linecap="round"/><path d="M904.8,175.7 L902.0,164.0 L894.6,173.4" style="fill:none;stroke:var(--muted)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="150.0" y1="350.0" x2="1170.0" y2="350.0" style="stroke:var(--muted)" stroke-width="2.2" stroke-linecap="round"/><path d="M1159.2,355.2 L1170.0,350.0 L1159.2,344.8" style="fill:none;stroke:var(--muted)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1170" y="376" font-size="15.5" font-weight="500" text-anchor="end" class="muted">time</text>
<text x="40" y="410" font-size="17" font-weight="500" text-anchor="start" class="muted">The interpreter counts the fuel itself and stops a task between two instructions, as plain data.</text>
<text x="40" y="438" font-size="17" font-weight="500" text-anchor="start" class="muted">The kernel then runs another task, or the same one again, from exactly where it stopped.</text>
</svg>
