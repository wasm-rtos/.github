<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Fuel counts every instruction; a stopped program is a portable snapshot">
<title>Fuel counts every instruction; a stopped program is a portable snapshot</title>
<style>
:root {
  --fg:#1f2328; --muted:#59636e; --card:#f6f8fa; --line:#d0d7de; --bg:#ffffff;
  --prog:#6c5ce7; --prog-soft:#f0eefe;
