<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Paged memory with a page store, and predecoded code kept as a cache">
<title>Paged memory with a page store, and predecoded code kept as a cache</title>
<style>
:root {
  --fg:#1f2328; --muted:#59636e; --card:#f6f8fa; --line:#d0d7de; --bg:#ffffff;
  --prog:#6c5ce7; --prog-soft:#f0eefe;
  --kern:#0e9384; --kern-soft:#e6f6f4;
  --vm:#d9692a; --vm-soft:#fdf0e8;
  --board:#2f6fdf; --board-soft:#eaf1fd;
  --stop:#d1242f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fg:#e6edf3; --muted:#9198a1; --card:#161b22; --line:#30363d; --bg:#0d1117;
    --prog:#a29bfe; --prog-soft:#1f1b3a;
    --kern:#3ec9b6; --kern-soft:#0f2a27;
    --vm:#f39a5c; --vm-soft:#33200f;
    --board:#6ea2ff; --board-soft:#132440;
    --stop:#ff7b72;
  }
}
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
.muted { fill: var(--muted); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
<text x="40" y="40" font-size="20" font-weight="700" text-anchor="start">A program's memory, in frames of 4 KiB</text>
<rect x="40" y="64" width="40" height="40" rx="6" style="fill:var(--vm);stroke:var(--vm)" stroke-width="0"/>
<rect x="88" y="64" width="40" height="40" rx="6" style="fill:var(--vm);stroke:var(--vm)" stroke-width="0"/>
<rect x="136" y="64" width="40" height="40" rx="6" style="fill:var(--board-soft);stroke:var(--board)" stroke-width="2"/>
<rect x="184" y="64" width="40" height="40" rx="6" style="fill:var(--vm);stroke:var(--vm)" stroke-width="0"/>
<rect x="232" y="64" width="40" height="40" rx="6" style="fill:var(--card);stroke:var(--line)" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="280" y="64" width="40" height="40" rx="6" style="fill:var(--card);stroke:var(--line)" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="328" y="64" width="40" height="40" rx="6" style="fill:var(--board-soft);stroke:var(--board)" stroke-width="2"/>
<rect x="376" y="64" width="40" height="40" rx="6" style="fill:var(--vm);stroke:var(--vm)" stroke-width="0"/>
<rect x="424" y="64" width="40" height="40" rx="6" style="fill:var(--vm);stroke:var(--vm)" stroke-width="0"/>
<rect x="472" y="64" width="40" height="40" rx="6" style="fill:var(--card);stroke:var(--line)" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="520" y="64" width="40" height="40" rx="6" style="fill:var(--board-soft);stroke:var(--board)" stroke-width="2"/>
<rect x="568" y="64" width="40" height="40" rx="6" style="fill:var(--card);stroke:var(--line)" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="40" y="128" width="18" height="18" rx="4" style="fill:var(--vm);stroke:var(--vm)" stroke-width="1.8"/>
<text x="66" y="143" font-size="15.5" font-weight="500" text-anchor="start" class="muted">in RAM</text>
<rect x="141.2" y="128" width="18" height="18" rx="4" style="fill:var(--board-soft);stroke:var(--board)" stroke-width="1.8"/>
<text x="167.2" y="143" font-size="15.5" font-weight="500" text-anchor="start" class="muted">in the page store</text>
<rect x="332.59999999999997" y="128" width="18" height="18" rx="4" style="fill:var(--card);stroke:var(--line)" stroke-width="1.8" stroke-dasharray="4 3"/>
<text x="358.59999999999997" y="143" font-size="15.5" font-weight="500" text-anchor="start" class="muted">never touched: costs nothing</text>
<rect x="40" y="178" width="250" height="150" rx="14" style="fill:var(--vm-soft);stroke:var(--vm)" stroke-width="2"/>
<text x="60" y="212" font-size="20" font-weight="700" text-anchor="start" style="fill:var(--vm)">RAM</text>
<text x="60" y="240" font-size="16" font-weight="500" text-anchor="start" class="muted">a budget of frames;</text>
<text x="60" y="262" font-size="16" font-weight="500" text-anchor="start" class="muted">a TLB finds them</text>
<rect x="60" y="280" width="34" height="30" rx="5" style="fill:var(--vm);stroke:var(--vm)" stroke-width="0"/>
<rect x="102" y="280" width="34" height="30" rx="5" style="fill:var(--vm);stroke:var(--vm)" stroke-width="0"/>
<rect x="144" y="280" width="34" height="30" rx="5" style="fill:var(--vm);stroke:var(--vm)" stroke-width="0"/>
<rect x="186" y="280" width="34" height="30" rx="5" style="fill:var(--vm);stroke:var(--vm)" stroke-width="0"/>
<rect x="228" y="280" width="34" height="30" rx="5" style="fill:var(--vm);stroke:var(--vm)" stroke-width="0"/>
<rect x="330" y="178" width="250" height="150" rx="14" style="fill:var(--board-soft);stroke:var(--board)" stroke-width="2"/>
<text x="350" y="212" font-size="20" font-weight="700" text-anchor="start" style="fill:var(--board)">Page store</text>
<text x="350" y="240" font-size="16" font-weight="500" text-anchor="start" class="muted">SD card, SPI RAM,</text>
<text x="350" y="262" font-size="16" font-weight="500" text-anchor="start" class="muted">FRAM or flash</text>
<rect x="350" y="280" width="54" height="34" rx="5" style="fill:var(--card);stroke:var(--board)" stroke-width="2"/>
<path d="M350,292 L362,280" style="stroke:var(--board)" stroke-width="2"/>
<line x1="292.0" y1="226.0" x2="326.0" y2="226.0" style="stroke:var(--muted)" stroke-width="2.2" stroke-linecap="round"/><path d="M315.2,231.2 L326.0,226.0 L315.2,220.8" style="fill:none;stroke:var(--muted)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="326.0" y1="282.0" x2="292.0" y2="282.0" style="stroke:var(--muted)" stroke-width="2.2" stroke-linecap="round"/><path d="M302.8,276.8 L292.0,282.0 L302.8,287.2" style="fill:none;stroke:var(--muted)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="40" y="368" font-size="16" font-weight="500" text-anchor="start" class="muted">Touched: the frame comes in, the program waits, others run.</text>
<text x="40" y="392" font-size="16" font-weight="500" text-anchor="start" class="muted">Out of room: one not touched lately goes;</text>
<text x="40" y="416" font-size="16" font-weight="500" text-anchor="start" class="muted">only a written (dirty) frame is stored again.</text>
<line x1="620" y1="30" x2="620" y2="440" style="stroke:var(--line)" stroke-width="1.5"/>
<text x="660" y="40" font-size="20" font-weight="700" text-anchor="start">Code as a cache</text>
<text x="660" y="97" font-size="17" font-weight="600" text-anchor="start" class="mono">main</text>
<rect x="800" y="76" width="190" height="30" rx="6" style="fill:var(--kern-soft);stroke:var(--kern)" stroke-width="2"/>
<text x="1002" y="97" font-size="15.5" font-weight="500" text-anchor="start" class="muted">on the stack: kept</text>
<text x="660" y="155" font-size="17" font-weight="600" text-anchor="start" class="mono">crc16</text>
<rect x="800" y="134" width="140" height="30" rx="6" style="fill:var(--vm-soft);stroke:var(--vm)" stroke-width="2"/>
<text x="952" y="155" font-size="15.5" font-weight="500" text-anchor="start" class="muted">records</text>
<text x="660" y="213" font-size="17" font-weight="600" text-anchor="start" class="mono">list_find</text>
<rect x="800" y="192" width="170" height="30" rx="6" style="fill:var(--vm-soft);stroke:var(--vm)" stroke-width="2"/>
<text x="982" y="213" font-size="15.5" font-weight="500" text-anchor="start" class="muted">records</text>
<text x="660" y="271" font-size="17" font-weight="600" text-anchor="start" class="mono">matrix_mul</text>
<rect x="800" y="250" width="115" height="30" rx="6" style="fill:var(--vm-soft);stroke:var(--vm)" stroke-width="2"/>
<text x="927" y="271" font-size="15.5" font-weight="500" text-anchor="start" class="muted">records</text>
<text x="660" y="329" font-size="17" font-weight="600" text-anchor="start" class="mono">printf</text>
<rect x="800" y="308" width="70" height="30" rx="6" style="fill:var(--card);stroke:var(--line)" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="882" y="329" font-size="15.5" font-weight="500" text-anchor="start" class="muted">never called: no records</text>
<text x="660" y="387" font-size="17" font-weight="600" text-anchor="start" class="mono">setup_uart</text>
<rect x="800" y="366" width="70" height="30" rx="6" style="fill:var(--card);stroke:var(--line)" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="882" y="387" font-size="15.5" font-weight="500" text-anchor="start" class="muted">dropped, made again if called</text>
<text x="660" y="438" font-size="16" font-weight="500" text-anchor="start" class="muted">Memory comes first: records go when a frame needs the room.</text>
</svg>
